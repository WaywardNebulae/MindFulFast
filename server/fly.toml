# fly.io deployment for the MindfulFast push scheduler.
#
# The scheduler must stay running to fire alarms, so the machine is pinned
# on rather than auto-stopped, and the schedule lives on a volume so a
# restart does not lose it.
#
#   fly launch --no-deploy --copy-config
#   fly volumes create mindfulfast_data --size 1
#   fly secrets set VAPID_PUBLIC_KEY=... VAPID_PRIVATE_KEY=... VAPID_SUBJECT=mailto:you@example.com
#   fly deploy

app = "mindfulfast-push"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  DATA_FILE = "/app/data/devices.json"

[[mounts]]
  source = "mindfulfast_data"
  destination = "/app/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = false      # a stopped machine fires no alarms
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  path = "/health"
  interval = "30s"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
