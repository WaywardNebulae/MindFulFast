name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest and required assets
        run: |
          set -euo pipefail
          python3 -c "import json; json.load(open('manifest.json'))"
          python3 - <<'PY'
          import json, sys, pathlib
          m = json.load(open('manifest.json'))
          missing = [i['src'] for i in m.get('icons', []) if not pathlib.Path(i['src']).is_file()]
          missing += [s['src'] for s in m.get('screenshots', []) if not pathlib.Path(s['src']).is_file()]
          sizes = {i['sizes'] for i in m.get('icons', [])}
          for need in ('192x192', '512x512'):
              if need not in sizes: missing.append(f'icon size {need}')
          if not any(i.get('purpose') == 'maskable' for i in m.get('icons', [])):
              missing.append('a maskable icon')
          if missing:
              print('MISSING:'); [print(' -', x) for x in missing]; sys.exit(1)
          print(f"manifest: {len(m['icons'])} icons, {len(m['screenshots'])} screenshots, all present")
          PY
          for f in index.html sw.js fonts.css privacy.html; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done

      - name: Check the app's JavaScript parses
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, pathlib
          html = pathlib.Path('index.html').read_text()
          m = re.search(r'<script>(.*)</script>', html, re.S)
          assert m, 'no inline script in index.html'
          pathlib.Path('/tmp/app.js').write_text(m.group(1))
          PY
          node --check /tmp/app.js
          node --check sw.js

      - name: Check every asset the service worker precaches exists
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, sys, pathlib
          sw = pathlib.Path('sw.js').read_text()
          paths = re.findall(r"'\./([^']*)'", re.search(r'const ASSETS = \[(.*?)\];', sw, re.S).group(1))
          missing = [p for p in paths if p and not pathlib.Path(p).is_file()]
          if missing:
              print('service worker precaches missing files:'); [print(' -', p) for p in missing]; sys.exit(1)
          print(len(paths), 'precached paths all resolve')
          PY

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
