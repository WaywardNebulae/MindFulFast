<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tile" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#f7faf8"/>
      <stop offset="55%" stop-color="#EDF1EF"/>
      <stop offset="100%" stop-color="#e4ebe7"/>
    </linearGradient>
    <radialGradient id="mintGlow" cx="50%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#2F6E63" stop-opacity="0.12"/>
      <stop offset="55%" stop-color="#2F6E63" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="topWash" cx="35%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="42%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="depth" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#101B22" stop-opacity="0.06"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#tile)"/>
    <rect width="512" height="512" fill="url(#mintGlow)"/>
    <rect width="512" height="512" fill="url(#topWash)"/>
    <rect width="512" height="512" fill="url(#depth)"/>

    <g transform="translate(155,78) rotate(-18)" opacity="0.55">
      <ellipse cx="55" cy="32" rx="72" ry="40" fill="url(#chip)"/>
    </g>

    <g transform="translate(256,256) scale(7.2) translate(-17,-17)">
      <circle cx="17" cy="17" r="15.5" fill="none" stroke="#2F6E63" stroke-width="1.3"/>
      <path d="M17 25c0-4.2 2.4-7.4 6.2-8.6C22.8 21 20.4 24.2 17 25z"
            fill="#2F6E63" fill-opacity=".22" stroke="#2F6E63" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M17 25c0-4.2-2.4-7.4-6.2-8.6C11.2 21 13.6 24.2 17 25z"
            fill="#2F6E63" fill-opacity=".35" stroke="#2F6E63" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M17 25V17.5" fill="none" stroke="#2F6E63" stroke-width="1.3" stroke-linecap="round"/>
    </g>
  </g>

  <rect x="3" y="3" width="506" height="506" rx="109" ry="109"
        fill="none" stroke="#2F6E63" stroke-opacity="0.18" stroke-width="3"/>
  <path d="M40,70 Q256,18 472,70" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/>
</svg>
